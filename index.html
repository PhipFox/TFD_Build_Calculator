<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TFD Build-Rechner – Nell</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2330;--line:#2b3445;--txt:#e6edf3;--mut:#8b98a9;--acc:#5fd4ff;--acc2:#b48cff;--ok:#5fe0a0;--warn:#ffc35f;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.45}
header{padding:14px 22px 18px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#111a26,#1a1430)}
header h1{margin:0;font-size:20px;letter-spacing:.3px}
header p{margin:4px 0 0;color:var(--mut);font-size:13px}
/* Sprach-Schalter */
.lang{display:inline-flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12px;font-weight:600;color:var(--mut);user-select:none}
.lang .on{color:var(--txt)}
.switch{position:relative;width:46px;height:24px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;cursor:pointer;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--acc);transition:transform .2s}
.switch[aria-checked="true"]::after{transform:translateX(22px);background:var(--acc2)}
.switch:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
nav{display:flex;gap:4px;padding:10px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
nav button{background:none;border:1px solid transparent;color:var(--mut);padding:7px 14px;border-radius:6px;cursor:pointer;font-size:14px}
nav button.on{color:var(--txt);border-color:var(--line);background:var(--panel)}
main{padding:18px 22px;max-width:1250px}
.view{display:none}.view.on{display:block}
.grid{display:grid;grid-template-columns:330px 1fr;gap:18px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:15px;color:var(--acc)}
.card h3{margin:12px 0 6px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0}
label span{color:var(--mut)}
select,input[type=number]{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:13px}
input[type=number]{width:80px}
.chk{justify-content:flex-start}
.btn{background:var(--acc);color:#04121a;border:0;border-radius:7px;padding:9px 16px;font-weight:600;cursor:pointer;font-size:14px;width:100%;margin-top:8px}
.btn.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.kpi b{display:block;font-size:20px}
.kpi small{color:var(--mut)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:#243044;color:var(--mut);margin-right:4px}
.s-Almandine{color:#ff8a8a}.s-Malachite{color:#6be3a0}.s-Rutile{color:#ffd36b}.s-Xantic{color:#c59bff}.s-Cerulean{color:#6bc7ff}
.note{color:var(--mut);font-size:12px}
.warn{color:var(--warn)}
.alt{opacity:.85}
.pill{display:inline-block;padding:2px 8px;border-radius:5px;background:#1f2a3a;margin:2px 4px 2px 0;font-size:12px}
.src{color:var(--mut);font-size:12px}
a{color:var(--acc)}
.ico{display:inline-block;vertical-align:middle;flex:none}
.mname{display:flex;align-items:center;gap:8px}
.mname .ico{width:30px;height:30px}
.sname{display:flex;align-items:center;gap:10px}
.sname .ico{width:40px;height:40px}
.pill .ico{width:16px;height:16px;margin-right:4px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.legend span{display:flex;align-items:center;gap:5px;color:var(--mut);font-size:12px}
.legend .ico{width:20px;height:20px}
img.ico{object-fit:contain;border-radius:8px;background:#0f141c}
.sname img.ico{border-radius:50%}
.status{padding:8px 10px;border-radius:6px;background:var(--panel2);margin:8px 0;font-size:13px}
.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}
input[type=text],input[type=password]{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;width:100%}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.row .btn{width:auto;margin:0;white-space:nowrap}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Exo+2:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== Sci-Fi-Theme im Stil des Spiels ===== */
:root{
  /* Hintergrund in den Farben des Charakters (Nell: schwarzes Leder, Taupe, gedecktes Rosé) */
  --bg:#0a090a;--bg-glow1:rgba(201,138,146,.13);--bg-glow2:rgba(150,132,120,.11);--bg-grid:rgba(214,190,184,.03);
  --hdr:linear-gradient(100deg,rgba(13,11,12,.96) 0%,rgba(27,22,24,.94) 55%,rgba(74,44,52,.55) 100%);--bar:rgba(11,9,10,.92);
  --panel:rgba(20,18,20,.88);--panel2:rgba(31,27,30,.92);--line:rgba(120,190,220,.18);--line2:rgba(120,210,240,.42);
  --txt:#dbe7ef;--mut:#7f95a6;--acc:#3fe0ff;--acc2:#ffb347;--ok:#59f2b0;--warn:#ffb347;--bad:#ff5c6c;
  --cut:12px;--head:"Rajdhani","Bahnschrift","Segoe UI",sans-serif;
}
html{background:var(--bg)}
body{
  font-family:"Exo 2","Segoe UI",system-ui,sans-serif;letter-spacing:.15px;
  background:
    radial-gradient(1200px 600px at 85% -10%,var(--bg-glow1),transparent 60%),
    radial-gradient(900px 500px at -10% 110%,var(--bg-glow2),transparent 60%),
    linear-gradient(var(--bg-grid) 1px,transparent 1px) 0 0/100% 32px,
    linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px) 0 0/32px 100%,
    var(--bg);
  background-attachment:fixed;min-height:100vh;
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px)}
::selection{background:rgba(63,224,255,.35)}

/* Kopfbereich */
header{position:relative;overflow:hidden;padding:16px 28px 22px;border-bottom:1px solid var(--line2);
  background:var(--hdr)}
header::before{content:"";position:absolute;right:-40px;top:0;bottom:0;width:420px;opacity:.5;
  background:repeating-linear-gradient(-60deg,transparent 0 14px,rgba(214,170,174,.08) 14px 16px);
  -webkit-mask:linear-gradient(90deg,transparent,#000 60%);mask:linear-gradient(90deg,transparent,#000 60%)}
header::after{content:"";position:absolute;left:0;bottom:-1px;width:260px;height:3px;
  background:linear-gradient(90deg,var(--acc),transparent)}
header h1{font-family:var(--head);font-weight:700;font-size:30px;text-transform:uppercase;letter-spacing:2.5px;line-height:1.1;
  text-shadow:0 0 18px rgba(63,224,255,.25)}
header h1 span[style]{color:var(--acc2)!important;text-shadow:0 0 18px rgba(255,179,71,.35)}
header p{font-family:var(--head);font-size:13px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut)}
.lang{font-family:var(--head);letter-spacing:1.5px}
.switch{border-radius:0;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);border-color:var(--line2);background:rgba(10,20,30,.9)}
.switch::after{border-radius:0;clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px);box-shadow:0 0 10px var(--acc)}
.switch[aria-checked="true"]::after{box-shadow:0 0 10px var(--acc2)}

/* Navigation */
nav{gap:2px;padding:0 28px;background:var(--bar);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;backdrop-filter:blur(6px)}
nav button{font-family:var(--head);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:1.8px;
  border:0;border-radius:0;padding:14px 18px 12px;color:var(--mut);position:relative;transition:color .15s,background .15s}
nav button:hover{color:var(--txt);background:rgba(63,224,255,.05)}
nav button.on{background:linear-gradient(180deg,rgba(63,224,255,.0),rgba(63,224,255,.12));color:var(--acc);border:0}
nav button.on::after{content:"";position:absolute;left:10%;right:10%;bottom:0;height:2px;background:var(--acc);box-shadow:0 0 12px var(--acc)}

main{padding:22px 28px}

/* Panels mit abgeschrägten Ecken */
.card{position:relative;border:0;border-radius:0;background:
    linear-gradient(var(--panel),var(--panel)) padding-box;
  clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));
  box-shadow:inset 0 0 0 1px var(--line);padding:16px 18px 18px}
.card::before{content:"";position:absolute;left:0;top:0;width:var(--cut);height:var(--cut);
  background:linear-gradient(135deg,transparent 48%,var(--line2) 50%,transparent 54%)}
.card::after{content:"";position:absolute;right:0;top:0;width:46px;height:2px;background:var(--acc);opacity:.75}
.card h2{font-family:var(--head);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:2px;color:var(--acc);
  display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card h2::before{content:"";width:8px;height:8px;background:var(--acc);transform:rotate(45deg);box-shadow:0 0 8px var(--acc);flex:none}
.card h3{font-family:var(--head);font-weight:600;font-size:13px;letter-spacing:2px;color:var(--acc2);
  border-top:1px solid var(--line);padding-top:10px;margin-top:14px}

/* Formulare */
label span{color:var(--mut)}
select,input[type=number],input[type=text],input[type=password]{border-radius:0;border:1px solid var(--line2);background:rgba(8,7,8,.88);
  color:var(--txt);font-family:"Exo 2",sans-serif;padding:6px 8px;transition:border-color .15s,box-shadow .15s}
select:focus,input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 12px rgba(63,224,255,.25)}
input[type=checkbox]{accent-color:var(--acc);width:15px;height:15px}
input[type=file]{color:var(--mut);font-family:"Exo 2",sans-serif}
input[type=file]::file-selector-button{background:rgba(18,30,44,.9);color:var(--txt);border:1px solid var(--line2);padding:6px 12px;margin-right:10px;cursor:pointer;font-family:var(--head);letter-spacing:1px;text-transform:uppercase}

/* Buttons */
.btn{border-radius:0;font-family:var(--head);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:2px;padding:11px 16px;
  background:linear-gradient(180deg,#5ae8ff,#18b8dc);color:#02131b;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  box-shadow:0 0 18px rgba(63,224,255,.35);transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(1px)}
.btn.sec{background:linear-gradient(180deg,rgba(255,179,71,.16),rgba(255,179,71,.06));color:var(--acc2);border:0;
  box-shadow:inset 0 0 0 1px rgba(255,179,71,.55)}

/* Tabellen */
table{border-collapse:separate;border-spacing:0}
th{font-family:var(--head);font-weight:600;text-transform:uppercase;letter-spacing:1.5px;font-size:12px;color:var(--mut);
  border-bottom:1px solid var(--line2);background:rgba(63,224,255,.04)}
td{border-bottom:1px solid var(--line)}
tr:not(:first-child):hover td{background:rgba(63,224,255,.045)}
td b{font-family:var(--head);font-size:15px;font-weight:700;letter-spacing:.6px}

/* KPI-Kacheln */
.kpis{gap:10px}
.kpi{position:relative;border:0;border-radius:0;background:linear-gradient(180deg,rgba(63,224,255,.08),rgba(63,224,255,.02));
  box-shadow:inset 0 0 0 1px var(--line);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--acc)}
.kpi small{font-family:var(--head);text-transform:uppercase;letter-spacing:1.5px;font-size:11px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi b{white-space:nowrap;font-family:var(--head);font-size:21px;font-weight:700;letter-spacing:.5px;color:#fff}
.kpi:first-child{background:linear-gradient(180deg,rgba(255,179,71,.16),rgba(255,179,71,.03))}
.kpi:first-child::before{background:var(--acc2)}
.kpi:first-child b{color:var(--acc2);text-shadow:0 0 14px rgba(255,179,71,.4)}

/* Tags, Pills, Hinweise */
.tag{border-radius:0;background:rgba(63,224,255,.08);color:#9fdcec;border:1px solid rgba(63,224,255,.25);
  font-family:var(--head);font-weight:600;letter-spacing:1px;text-transform:uppercase;font-size:10.5px;padding:0 6px}
.trn{color:#ff4d5e;text-shadow:0 0 8px rgba(255,77,94,.35)}
.tag.trn{color:#ff4d5e;border-color:rgba(255,77,94,.45);background:rgba(255,77,94,.1);text-shadow:none}
.pill{border-radius:0;background:rgba(10,20,30,.9);border:1px solid var(--line);display:inline-flex;align-items:center}
.status{border-radius:0;border-left:3px solid var(--mut);background:rgba(4,10,16,.7)}
.status.ok{border-left-color:var(--ok)}.status.bad{border-left-color:var(--bad)}
p.warn{border-left:3px solid var(--warn);padding:6px 10px;background:rgba(255,179,71,.06)}
.note{color:var(--mut)}
img.ico{border-radius:0;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  background:radial-gradient(circle at 50% 35%,rgba(63,224,255,.18),rgba(4,10,16,.95))}
.sname img.ico{clip-path:none;border-radius:50%;box-shadow:0 0 0 1px var(--line2),0 0 12px rgba(63,224,255,.25)}
.s-Almandine{color:#ff7d7d}.s-Malachite{color:#5ff0a8}.s-Rutile{color:#ffd166}.s-Xantic{color:#c39bff}.s-Cerulean{color:#5cc8ff}
td[class^="s-"]{font-family:var(--head);font-weight:600;letter-spacing:1px;text-transform:uppercase;font-size:12.5px}
ul{padding-left:18px}li::marker{color:var(--acc)}
a{color:var(--acc)}
.grid{grid-template-columns:340px 1fr}
@media(max-width:900px){.grid{grid-template-columns:1fr}nav{padding:0 10px}main,header{padding-left:14px;padding-right:14px}}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:rgba(63,224,255,.25);border:2px solid var(--bg)}

/* Zahnrad (Daten & Annahmen) oben rechts */
.gear{position:absolute;right:28px;top:14px;z-index:2;width:36px;height:36px;padding:7px;cursor:pointer;color:var(--mut);
  background:rgba(8,7,8,.6);border:1px solid var(--line2);transition:color .15s,box-shadow .15s,border-color .15s;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.gear svg{display:block;width:100%;height:100%;transition:transform .4s}
.gear:hover{color:var(--txt)}.gear:hover svg{transform:rotate(60deg)}
.gear.on{color:var(--acc);border-color:var(--acc);box-shadow:inset 0 0 12px rgba(63,224,255,.25)}
.gear:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(max-width:900px){.gear{right:14px}}
/* Charakter-Portrait */
.hero{display:flex;gap:18px;align-items:flex-start;margin-bottom:14px}
.hero>div:last-child{min-width:0;flex:1}
.hero p:first-child{margin-top:0}
.portrait{flex:none;width:168px;height:168px;position:relative;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  background:radial-gradient(circle at 50% 30%,rgba(201,138,146,.28),rgba(10,9,10,.95) 75%);box-shadow:inset 0 0 0 1px var(--line2)}
.portrait img,.portrait svg{display:block;width:100%;height:100%;object-fit:cover}
.portrait::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(214,170,174,.45),inset 0 -30px 30px -18px rgba(10,9,10,.9)}
@media(max-width:600px){.hero{flex-direction:column}.portrait{width:140px;height:140px}}

/* ===== Waffen: Seltenheitsfarben, Karten, Tooltip ===== */
:root{--t1:#5cc8ff;--t2:#c39bff;--t3:#ffcf5c;--t4:#ff4d5e}
.t1{--tc:var(--t1)}.t2{--tc:var(--t2)}.t3{--tc:var(--t3)}.t4{--tc:var(--t4)}
.wn{color:var(--tc);font-family:var(--head);font-weight:700;font-size:15px;letter-spacing:.6px;line-height:1.15;
  text-shadow:0 0 9px color-mix(in srgb,var(--tc) 40%,transparent);overflow-wrap:anywhere}
.wtier{display:inline-block;font-family:var(--head);font-weight:600;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;padding:0 6px;
  color:var(--tc);border:1px solid color-mix(in srgb,var(--tc) 50%,transparent);background:color-mix(in srgb,var(--tc) 10%,transparent)}
.wsub{color:var(--mut);font-size:12px}
.wimg{display:block;width:100%;height:100%;object-fit:contain}
.wfilter{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.wfilter input[type=text]{width:auto;flex:1 1 180px;min-width:0}
.wfilter select{flex:0 1 auto;min-width:0;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--head);font-weight:600;font-size:12.5px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;padding:5px 10px;
  color:var(--tc);background:transparent;border:1px solid color-mix(in srgb,var(--tc) 45%,transparent);opacity:.6}
.chip[aria-pressed="true"]{opacity:1;background:color-mix(in srgb,var(--tc) 16%,transparent);box-shadow:0 0 10px color-mix(in srgb,var(--tc) 30%,transparent)}
.chip:hover{opacity:1}
.chip:focus-visible,.wcard:focus-visible,.wrm:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.wcard{position:relative;display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer;padding:8px 10px 10px;min-width:0;
  font-family:"Exo 2",sans-serif;color:var(--txt);border:0;border-top:2px solid var(--tc);
  background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 13%,transparent),rgba(4,10,16,.85) 60%);
  box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .15s,filter .15s}
.wcard:hover{filter:brightness(1.15);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tc) 55%,transparent)}
.wcard .wpic{height:64px;margin-bottom:2px}
.wcard[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--tc),0 0 16px color-mix(in srgb,var(--tc) 35%,transparent)}
.wcard[aria-pressed="true"]::after{content:"✓";position:absolute;right:6px;top:4px;width:20px;height:20px;line-height:20px;text-align:center;
  font-weight:700;font-size:13px;color:#04121a;background:var(--tc)}
.wslots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:700px){.wslots{grid-template-columns:1fr}}
.wslot{position:relative;display:flex;align-items:center;gap:10px;min-height:76px;padding:8px 34px 8px 10px;min-width:0;
  border-left:3px solid var(--tc,var(--line2));background:rgba(4,10,16,.7);box-shadow:inset 0 0 0 1px var(--line)}
.wslot .wpic{flex:none;width:96px;height:54px}
.wslot.empty{color:var(--mut);justify-content:center;padding:8px 10px;border-left:0;box-shadow:inset 0 0 0 1px var(--line);
  background:repeating-linear-gradient(-45deg,transparent 0 10px,rgba(120,190,220,.04) 10px 12px)}
.wrm{position:absolute;right:6px;top:6px;width:24px;height:24px;cursor:pointer;color:var(--mut);background:rgba(18,30,44,.9);border:1px solid var(--line2);
  font-size:14px;line-height:1;padding:0}
.wrm:hover{color:var(--bad);border-color:var(--bad)}
.wmini{display:flex;align-items:center;gap:8px;margin:6px 0;min-width:0}
.wmini .wpic{flex:none;width:58px;height:32px}
.wline{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 12px}
.wline .wl-h{font-family:var(--head);text-transform:uppercase;letter-spacing:1.5px;font-size:12px;color:var(--mut);margin-right:4px}
.wline .pill{gap:6px;padding:3px 8px;cursor:default}
.wline .pill .wpic{width:44px;height:24px}
.wline .pill .wn{font-size:13.5px}
#wtip{position:fixed;z-index:60;width:320px;max-width:calc(100vw - 16px);padding:12px 14px;pointer-events:none;display:none;
  background:#0e0c0e;border-top:2px solid var(--tc);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tc) 45%,transparent),0 10px 30px rgba(0,0,0,.6);font-size:12.5px}
#wtip.on{display:block}
#wtip .wn{font-size:18px}
#wtip .wt-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#wtip table{margin:8px 0 2px;font-size:12.5px}
#wtip td{padding:2px 0;border:0}
#wtip td:last-child{text-align:right;color:#fff;font-family:var(--head);font-weight:600;font-size:14px}
#wtip td:first-child{color:var(--mut)}
#wtip .wt-p{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
#wtip .wt-p b{color:var(--acc2);font-family:var(--head);font-size:14px;letter-spacing:.6px}
#wtip .wt-p p{margin:4px 0 0;white-space:pre-line}
</style>
</head>
<body>
<header>
  <button type="button" class="gear" id="gear" data-v="data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.03Z"/></svg></button>
  <div class="lang">
    <span id="lDe" class="on">DE</span>
    <button class="switch" id="langSwitch" role="switch" aria-checked="false" aria-label="Sprache / Language"></button>
    <span id="lEn">EN</span>
  </div>
  <h1><span data-i="title">TFD Build-Rechner</span> · <span style="color:var(--acc2)">Nell</span></h1>
  <p data-i="subtitle"></p>
</header>
<nav>
  <button data-v="opt" class="on" data-i="navOpt"></button>
  <button data-v="weap" data-i="navWeap"></button>
  <button data-v="char" data-i="navChar"></button>
  <button data-v="farm" data-i="navFarm"></button>
</nav>
<main>

<!-- OPTIMIERER -->
<section id="opt" class="view on">
<div class="grid">
<div>
  <div class="card">
    <h2 data-i="goal"></h2>
    <label><span data-i="buildType"></span>
      <select id="mode">
        <option value="boss" data-i="optBoss"></option>
        <option value="mob" data-i="optMob"></option>
      </select></label>
    <label><span data-i="wCd"></span><input type="number" id="wCd" value="0.5" step="0.1" min="0" max="2"></label>
    <label><span data-i="wRange"></span><input type="number" id="wRange" value="0" step="0.1" min="0" max="2"></label>
    <label class="chk"><input type="checkbox" id="needHp"> <span data-i="needHp"></span></label>
    <h3 data-i="condH"></h3>
    <label class="chk"><input type="checkbox" id="condDecimator"> <span data-i="condDec"></span></label>
    <label class="chk"><input type="checkbox" id="condAmbush" checked> <span data-i="condAmb"></span></label>
  </div>
  <div class="card">
    <h2 data-i="yourState"></h2>
    <label><span data-i="capacity"></span><input type="number" id="cap" value="85" min="40" max="85"></label>
    <label><span data-i="modLvl"></span><select id="lvl"></select></label>
    <label class="chk"><input type="checkbox" id="allMatch" checked> <span data-i="allMatch"></span></label>
    <div class="note" data-i="allMatchNote"></div>
    <h3 data-i="reactorH"></h3>
    <label><span data-i="reactorH"></span>
      <select id="reactor">
        <option value="mech">Materialized Mechanics (Tech)</option>
        <option value="mix">Materialized Mixture (Fusion)</option>
      </select></label>
    <h3 data-i="compsH"></h3>
    <label><span data-i="set"></span>
      <select id="comps">
        <option value="hunter">2× Hunter + 2× Ascending</option>
        <option value="slayer">4× Slayer</option>
      </select></label>
    <h3 data-i="triggerH"></h3>
    <label><span>Trigger</span>
      <select id="trigger">
        <option value="pb">Power Beyond (+15 % Skill Power)</option>
        <option value="none" data-i="none"></option>
      </select></label>
    <button class="btn" id="run" data-i="run"></button>
    <button class="btn sec" id="cmp" data-i="cmp"></button>
  </div>
  <div class="card">
    <h2 data-i="wOptH"></h2>
    <div id="wOpt"></div>
    <button class="btn sec" id="wGo" data-i="wGo"></button>
    <div class="note" data-i="wOptNote" style="margin-top:8px"></div>
  </div>
</div>
<div>
  <div class="card" id="result"></div>
  <div class="card" id="alts" style="display:none"></div>
</div>
</div>
</section>

<!-- WAFFEN -->
<section id="weap" class="view">
<div class="card">
  <h2 data-i="wSelH"></h2>
  <div class="wslots" id="wSlots"></div>
  <p class="warn" id="wMsg" role="status" style="border:0;background:none;padding:0;margin:8px 0 0;min-height:1.4em"></p>
  <p class="note" data-i="wSelNote" style="margin:0"></p>
</div>
<div class="card">
  <h2 data-i="wAllH"></h2>
  <div class="wfilter">
    <input type="text" id="wSearch" autocomplete="off">
    <select id="wType"></select>
    <select id="wRounds"></select>
    <div class="chips" id="wTiers"></div>
  </div>
  <p class="note"><span id="wCount"></span> · <span data-i="wHint"></span></p>
  <div class="wgrid" id="wGrid"></div>
  <div id="wStatus" class="status" style="margin-top:14px"></div>
  <div class="row"><button class="btn sec" id="wReload" data-i="wReload"></button></div>
  <p class="note" data-i="wSrcNote"></p>
</div>
</section>

<!-- CHARAKTER -->
<section id="char" class="view">
<div class="card">
  <h2>Nell</h2>
  <div class="hero">
    <div class="portrait" id="nellPic"></div>
    <div>
      <p data-i="nellIntro"></p>
      <h3 data-i="comboH"></h3>
      <p data-i="combo"></p>
    </div>
  </div>
  <table id="skillTbl"></table>
</div>
<div class="card">
  <h2 data-i="transH"></h2>
  <table>
    <tr><th data-i="thModule"></th><th data-i="thEffect"></th><th data-i="thUse"></th></tr>
    <tr><td><div class="mname" id="icoSH"><b class="trn">Shattered Heart</b></div></td><td data-i="shEff"></td><td data-i="shUse"></td></tr>
    <tr><td><div class="mname" id="icoRH"><b class="trn">Restored Heart</b></div></td><td data-i="rhEff"></td><td data-i="rhUse"></td></tr>
  </table>
</div>
</section>

<!-- FARMING -->
<section id="farm" class="view">
<div class="card">
  <h2 data-i="unlockH"></h2>
  <p data-i="prereq"></p>
  <h3 data-i="bpH"></h3>
  <ul data-i="bpList"></ul>
  <h3 data-i="matH"></h3>
  <table id="matTbl"></table>
  <p class="note" data-i="shop"></p>
</div>
<div class="card">
  <h2 data-i="srcH"></h2>
  <table id="srcTbl"></table>
  <p class="note" data-i="srcTip"></p>
</div>
</section>

<!-- DATEN -->
<section id="data" class="view">
<div class="card">
  <h2 data-i="howH"></h2>
  <p data-i="fDmg"></p>
  <p data-i="fScore"></p>
  <ul>
    <li data-i="r1"></li>
    <li data-i="r2"></li>
    <li data-i="r3"></li>
    <li data-i="r4"></li>
    <li><span data-i="r5a"></span> <input type="number" id="baseCr" value="5" style="width:60px"> <span data-i="r5b"></span> <input type="number" id="baseCd" value="150" style="width:60px"> <span data-i="r5c"></span></li>
    <li><span data-i="r6"></span> <input type="number" id="shCap" value="8" style="width:60px"> <span class="warn" data-i="assumed"></span></li>
  </ul>
  <p class="warn" data-i="estWarn"></p>
</div>
<div class="card" id="iconCard">
  <h2 data-i="icH"></h2>
  <p class="note" data-i="icIntro"></p>
  <div id="icStatus" class="status"></div>
  <label class="chk"><input type="checkbox" id="useOff" checked> <span data-i="icUse"></span></label>
  <h3 data-i="icAuto"></h3>
  <div class="row"><button class="btn" id="icLoad" data-i="icLoadBtn"></button></div>
  <h3 data-i="icKeyH"></h3>
  <p class="note" data-i="icKeyNote"></p>
  <div class="row"><input type="password" id="apiKey" placeholder="API-Key"><button class="btn sec" id="icKeyBtn" data-i="icKeyBtn"></button></div>
  <h3 data-i="icFileH"></h3>
  <p class="note" data-i="icFileNote"></p>
  <div class="row"><input type="file" id="metaFiles" accept=".json,application/json" multiple></div>
</div>
<div class="card">
  <h2 data-i="dbH"></h2>
  <div class="legend" id="legend"></div>
  <p class="note" data-i="icoNote"></p>
  <table id="modTbl"></table>
</div>
</section>
</main>
<div id="wtip" role="tooltip"></div>

function modStats(m,c){
  const out={};const add=(o)=>{for(const k in o){const v=m.sc.includes(k)?o[k]*CURVE[c.lvl]:o[k];out[k]=(out[k]||0)+v;}};
  add(m.st);
  if(m.cond==="Decimator"&&c.condDecimator)add(m.condSt);
  if(m.cond==="Ambush"&&c.condAmbush)add(m.condSt);
  return out;
}
function modCost(m,c){const raw=m.c+c.lvl;return c.allMatch?Math.ceil(raw/2):raw;}
function baseStats(c){
  const b={sp:0,spm:0,cr:c.baseCr+20,cd:c.baseCd,cdr:0,cost:0,range:0,hp:0}; // +20 Critrate aus Shattered Heart
  b.cdr+=7.4; b.cd+=33; // Reaktor-Substats (typischer Roll, angenommen)
  if(c.comps==="hunter"){b.cdr+=4;b.cost-=6.5;} else {b.sp+=26.1;b.cost+=15;}
  if(c.trigger==="pb")b.sp+=15;
  b.reactorOk=(c.mode==="boss"&&c.reactor==="mech")||(c.mode==="mob"&&c.reactor==="mix");
  return b;
}
function evaluate(list,c){
  const s0=baseStats(c);
  list.forEach(m=>{const s=modStats(m,c);for(const k in s)s0[k]=(s0[k]||0)+s[k];});
  const attrSpm=c.mode==="boss"?(s0.spmTech||0):(s0.spmFus||0);
  const SP=s0.sp+(s0.spNA||0), SPM=s0.spm+attrSpm;
  const cr=Math.min(s0.cr,100)/100, cd=s0.cd/100;
  let dmg=(1+SP/100)*(1+SPM/100)*(1+cr*(cd-1));
  if(!s0.reactorOk)dmg*=0.6; // falscher Reaktor-Typ (grob)
  const cdr=Math.min(s0.cdr,75)/100;
  const score=dmg*Math.pow(1/(1-cdr),c.wCd)*Math.pow(1+s0.range/100,c.wRange);
  return{score,dmg,SP,SPM,cr:s0.cr,cd:s0.cd,cdr:s0.cdr,cost:s0.cost,range:s0.range,hp:s0.hp,overCr:s0.cr>100,reactorOk:s0.reactorOk};
}
function optimize(c){
  const pool=MODS, slots=10, budget=c.cap-c.shCap;
  const best=[],keep=6,costs=pool.map(m=>modCost(m,c)),chosen=[];
  function rec(i,used,tags){
    if(chosen.length===slots||i===pool.length){
      if(!chosen.length)return;
      const list=chosen.map(j=>pool[j]);
      if(c.needHp&&!list.some(m=>m.surv))return;
      const r=evaluate(list,c);r.list=list;r.capUsed=used+c.shCap;
      if(best.length<keep||r.score>best[best.length-1].score){best.push(r);best.sort((a,b)=>b.score-a.score);if(best.length>keep)best.pop();}
      return;
    }
    const m=pool[i];
    if(used+costs[i]<=budget&&!(m.t&&tags.has(m.t))){
      chosen.push(i);if(m.t)tags.add(m.t);
      rec(i+1,used+costs[i],tags);
      chosen.pop();if(m.t)tags.delete(m.t);
    }
    rec(i+1,used,tags);
  }
  rec(0,0,new Set());
  return best;
}

        let i=keys.findIndex(k=>n.includes(k));
        if(i<0){const ty=String(s.skill_type||"").toLowerCase();const d=ty.match(/(\d)/);i=ty.includes("passive")?0:d?+d[1]:-1;}
        if(i>=0&&i<5&&s.skill_image_url)o.skills[i]=s.skill_image_url;
      });
    }
  }
  return o;
}
function store(o){OFFICIAL=o;icErr="";try{localStorage.setItem("tfdIcons",JSON.stringify(o));}catch(e){}rerender();}
function rerender(){renderStatic();if(shown==="best")$("run").onclick();else if(shown==="guide")$("cmp").onclick();else renderEmpty();}
function renderIconStatus(){
  const m=Object.keys(OFFICIAL.mods).length,s=OFFICIAL.skills.filter(Boolean).length;
  const el=$("icStatus");
  if(icErr){el.className="status bad";el.textContent=t("icErr",{e:icErr});}
  else if(m||s){el.className="status ok";el.textContent=t("icOk",{m,s});}
  else{el.className="status";el.textContent=t("icNone");}
}
async function loadOnline(key){
  const st=$("icStatus");st.className="status";st.textContent=t("icLoading");
  const opt=key?{headers:{"x-nxopen-api-key":key}}:{};
  try{
    const [d,m]=await Promise.all(["descendant.json","module.json"].map(f=>fetch(META+f,opt).then(r=>{if(!r.ok)throw new Error(f+": HTTP "+r.status);return r.json();})));
    const o=applyMeta(d,m);
    if(!Object.keys(o.mods).length&&!o.skills.length)throw new Error(LANG==="de"?"keine Bild-Links gefunden":"no image links found");
    store(o);
  }catch(e){icErr=(e&&e.message)||String(e);if(/fetch/i.test(icErr))icErr+=(LANG==="de"?" (CORS/Netzwerk – Schritt 2 oder 3 probieren)":" (CORS/network – try step 2 or 3)");renderIconStatus();}
}
$("icLoad").onclick=()=>loadOnline();
$("icKeyBtn").onclick=()=>{const k=$("apiKey").value.trim();try{localStorage.setItem("tfdKey",k);}catch(e){}loadOnline(k);};
$("metaFiles").onchange=async e=>{
  let desc=null,mods=null;
  for(const f of e.target.files){try{const j=JSON.parse(await f.text());const a=Array.isArray(j)?j:Object.values(j).find(Array.isArray)||[];
    if(a.some(x=>x&&x.weapon_name))setWeapons(a.some(x=>x&&Object.values(W_TYPES).some(v=>v[1]===x.weapon_type))?"de":"en",a);
    else if(a.some(x=>x&&x.descendant_skill))desc=a;else if(a.some(x=>x&&x.module_name))mods=a;}catch(err){icErr=f.name+": "+err.message;}}
  const o=applyMeta(desc,mods);const old=OFFICIAL;
  store({mods:Object.keys(o.mods).length?o.mods:old.mods,skills:o.skills.length?o.skills:old.skills,portrait:o.portrait||old.portrait});
};
$("useOff").onchange=e=>{USE_OFFICIAL=e.target.checked;try{localStorage.setItem("tfdUseOff",USE_OFFICIAL?"1":"0");}catch(err){}rerender();};
try{const c=JSON.parse(localStorage.getItem("tfdIcons")||"null");if(c&&c.mods)OFFICIAL={mods:c.mods,skills:c.skills||[],portrait:c.portrait};
  const k=localStorage.getItem("tfdKey");if(k)$("apiKey").value=k;
  if(localStorage.getItem("tfdUseOff")==="0"){USE_OFFICIAL=false;$("useOff").checked=false;}}catch(e){}
ensureWeapons();WSEL=WSEL.filter(id=>wById(id));
renderStatic();renderEmpty();
if(!Object.keys(OFFICIAL.mods).length)loadOnline($("apiKey").value.trim()||undefined);
</script>
</body>
